<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibel Game</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dibel Game">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  --ground:#EAF2FA; --card:#FFFFFF; --ink:#1B2A41; --ink-soft:#5B6B80; --line:#C9D6E4;
  --accent:#E4572E; --sun:#F5C242; --leaf:#3E9B5F; --amber:#E0A13A; --sky:#BFD9F2;
  --name:#4C7DD1; --name-soft:#DCE8FA; --leaf-soft:#D8F0E0; --amber-soft:#FBE8D2;
  --shadow:0 6px 24px rgba(27,42,65,.10);
  --f-read:'Andika','Trebuchet MS','Verdana',sans-serif;
  --f-ui:'Fredoka','Andika','Trebuchet MS',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14202E; --card:#1F2D3F; --ink:#EAF0F7; --ink-soft:#A9B6C6; --line:#3A4B60;
    --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B4460;
    --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#14202E; --card:#1F2D3F; --ink:#EAF0F7; --ink-soft:#A9B6C6; --line:#3A4B60;
  --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B4460;
  --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-read);font-size:18px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--name);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

.strip{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.iconbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:30px;height:30px}
.iconbtn.small{width:44px;height:44px}
.iconbtn.small svg{width:22px;height:22px}
.skyline{flex:1;height:44px;position:relative;border-radius:22px;background:var(--sky);overflow:hidden}
.skyline .kite{position:absolute;left:4%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;transition:left .5s ease}
.skyline .kite svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion: reduce){.skyline .kite{transition:none}.word .g{transition:none}}

.home{flex:1;display:flex;flex-direction:column;padding:6px 18px 18px;gap:14px;min-height:0}
.brand{font-family:var(--f-ui);font-weight:600;font-size:30px;text-wrap:balance}
.brand small{display:block;font-family:var(--f-read);font-weight:400;font-size:15px;color:var(--ink-soft);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}
@media (max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;position:relative;border:4px solid transparent;min-height:140px}
.tile:active{transform:scale(.98)}
.tile .glyph svg{width:84px;height:84px;display:block}
.tile .label{font-family:var(--f-ui);font-size:19px;color:var(--ink)}
.tile .who{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.tile .who svg{width:20px;height:20px}
.tile.locked{opacity:.45}
.levels{display:flex;gap:12px}
.lvl{flex:1;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:4px solid transparent;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.lvl.on{border-color:var(--accent)}
.lvl .kites{display:flex;gap:2px}
.lvl .kites svg{width:30px;height:30px}
.lvl .lab{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft)}
.lvl.on .lab{color:var(--ink)}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gate{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;overflow:hidden}
.gate svg{width:26px;height:26px;position:relative}
.gate .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky)}
.done-note{font-size:15px;color:var(--ink-soft)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;min-height:0;gap:16px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);width:100%;max-width:760px;min-height:260px;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;border:6px solid transparent;transition:border-color .3s,background .3s}
.card.ok{border-color:var(--leaf)}
.card.oops{border-color:var(--amber)}
.card .corner{position:absolute;top:12px;right:16px;font-size:44px;line-height:1}
.word{font-size:min(20vw,128px);line-height:1.15;display:flex;gap:.02em;justify-content:center;transition:gap .5s ease}
.word.split{gap:.5em}
.word .g{padding:0 .04em;border-radius:.12em;transition:background .2s,color .2s,opacity .2s;position:relative}
.word .g.lit{background:var(--sun)}
.word .g.silent{color:var(--ink-soft);opacity:.55}
.word.split .g:not(:last-child)::after{content:'';position:absolute;right:-.3em;top:55%;width:.12em;height:.12em;border-radius:50%;background:var(--ink-soft)}
.pic{font-size:min(30vw,150px);line-height:1}
.choices{display:flex;gap:16px;width:100%;max-width:760px;justify-content:center;flex-wrap:wrap}
.choice{flex:1;min-width:150px;min-height:110px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:min(9vw,56px);border:5px solid transparent;transition:border-color .2s,opacity .2s,transform .1s}
.choice:active{transform:scale(.97)}
.choice.glow{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.dim{opacity:.35}
.choice svg{width:76px;height:76px}
.choice.labeled{flex-direction:column;gap:8px;padding:14px 18px;font-family:var(--f-ui);font-weight:600;font-size:24px;min-height:150px}

.bar{display:flex;justify-content:center;gap:22px;padding:12px 18px 22px;align-items:center}
.act{height:92px;min-width:150px;padding:0 30px;border-radius:46px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-ui);font-weight:600;font-size:22px;box-shadow:var(--shadow);transition:transform .1s,opacity .2s}
.act:active{transform:scale(.97)}
.act svg{width:40px;height:40px}
.act.parts{background:var(--card);color:var(--ink)}
.act.helped{background:var(--amber);color:#1B2A41}
.act.readit{background:var(--leaf);color:#fff;min-width:210px}
.act[disabled]{opacity:.35;pointer-events:none}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.center h1{font-family:var(--f-ui);font-weight:600;font-size:34px;margin:0;text-wrap:balance}
.center p{margin:0;color:var(--ink-soft);max-width:34em}
.bigkite{width:min(50vw,260px);height:min(50vw,260px)}
.bigkite svg{width:100%;height:100%}

.parent{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:10px 16px;border-radius:999px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
.tab.on{background:var(--ink);color:var(--ground)}
.pane{display:none;flex:1;overflow:auto;padding:0 18px 28px;min-height:0}
.pane.on{display:block}
.pane h2{font-family:var(--f-ui);font-weight:600;font-size:22px;margin:18px 0 8px}
.pane h3{font-family:var(--f-ui);font-weight:600;font-size:15px;margin:16px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pane p,.pane li{font-size:16px;line-height:1.5;max-width:64ch}
.pane table{border-collapse:collapse;width:100%;max-width:760px;font-size:15px;font-variant-numeric:tabular-nums}
.pane th,.pane td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane th{font-family:var(--f-ui);font-weight:600;color:var(--ink-soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-family:var(--f-ui);font-weight:600;color:#1B2A41}
.pill.blue{background:#BFD9F2}.pill.green{background:#B9E3C6}.pill.yellow{background:#F8E3A3}.pill.red{background:#F5C1B3}.pill.grey{background:var(--line);color:var(--ink)}
.pbtn{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:12px 18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin:4px 6px 4px 0;min-height:48px}
.pbtn.primary{background:var(--name);color:#fff}
.pbtn.warn{background:var(--amber);color:#1B2A41}
.pbtn.on{outline:3px solid var(--name)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tipcard{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.tipcard b{font-family:var(--f-ui);display:block;margin-bottom:4px}
.field{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.note{font-size:15px;color:var(--ink-soft)}

.form{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);font-size:28px;line-height:1.9;max-width:900px}
.form .fr{display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline}
.form .fi{padding:0 6px;border-radius:8px;position:relative;display:inline-flex;align-items:baseline}
.form .fi.last{outline:3px solid var(--name);outline-offset:-3px}
.form .fi.after{opacity:.35}
.form .ch{padding:0 2px;border-radius:6px}
.form .ch.silent{color:var(--ink-soft)}
.form .ch.miss{background:var(--amber-soft);text-decoration:line-through;text-decoration-color:var(--accent)}
.form .wr{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block;margin-left:6px;align-self:center}
.form .wr.miss{background:var(--accent);border-color:var(--accent)}
.form .num{color:var(--ink-soft);font-size:.6em;margin-left:8px}
.timerbar{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.clock{font-family:var(--f-ui);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;min-width:64px}
.result{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin:12px 0;max-width:720px}
.result .n{font-family:var(--f-ui);font-weight:600;font-size:34px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="s-home">
  <div class="home">
    <div class="brand">Dibel Game<small id="home-sub">Make-believe words</small></div>
    <div class="levels" id="levels"></div>
    <div class="tiles" id="tiles"></div>
    <div class="homefoot">
      <span class="done-note" id="home-note"></span>
      <button class="gate" id="gate" aria-label="Grown-ups: hold for three seconds"><span class="fill"></span><span data-icon="lock"></span></button>
    </div>
  </div>
</section>

<section class="screen" id="s-play">
  <div class="strip">
    <button class="iconbtn" id="btn-home" aria-label="Home"><span data-icon="home"></span></button>
    <div class="skyline"><div class="kite" id="kite"><span data-icon="kite"></span></div></div>
    <span style="width:56px"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar"></div>
</section>

<section class="screen" id="s-end">
  <div class="center">
    <div class="bigkite"><span data-icon="kite"></span></div>
    <h1 id="end-title">The kite flew high.</h1>
    <p id="end-text"></p>
    <div class="bar" style="padding-bottom:0">
      <button class="act parts" id="btn-end-home" aria-label="Home"><span data-icon="home"></span></button>
      <button class="act readit" id="btn-end-more" aria-label="Another round"><span data-icon="next"></span></button>
    </div>
  </div>
</section>

<section class="screen" id="s-alldone">
  <div class="center">
    <div class="bigkite"><span data-icon="kiteHigh"></span></div>
    <h1>All done for today.</h1>
    <p>Reading time is finished. Go read a real book with someone.</p>
    <button class="act parts" id="btn-alldone-home" aria-label="Home"><span data-icon="home"></span></button>
  </div>
</section>

<section class="screen" id="s-parent">
  <div class="parent">
    <div class="strip">
      <button class="iconbtn small" id="btn-parent-close" aria-label="Close"><span data-icon="close"></span></button>
      <div class="brand" style="font-size:22px;flex:1">Grown-ups</div>
      <span class="note" id="parent-period"></span>
    </div>
    <div class="tabs">
      <button class="tab on" data-pane="how">How to play</button>
      <button class="tab" data-pane="timer">Timed run</button>
      <button class="tab" data-pane="progress">Progress</button>
      <button class="tab" data-pane="settings">Settings</button>
    </div>
    <div class="pane on" id="pane-how"></div>
    <div class="pane" id="pane-timer"></div>
    <div class="pane" id="pane-progress"></div>
    <div class="pane" id="pane-settings"></div>
  </div>
</section>

<section class="screen" id="s-timer">
  <div class="timerbar">
    <button class="iconbtn small" id="btn-timer-back" aria-label="Back"><span data-icon="close"></span></button>
    <span class="clock" id="clock">1:00</span>
    <button class="pbtn primary" id="btn-timer-start">Start</button>
    <button class="pbtn" id="btn-timer-stop" hidden>Stop</button>
    <span class="note" id="timer-note"></span>
  </div>
  <div class="pane on" id="timer-body"></div>
</section>

<div class="toast" id="toast"></div>
</div>
<script>
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  parts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="8" width="5" height="8" rx="1.5"/><rect x="9.5" y="8" width="5" height="8" rx="1.5"/><rect x="16" y="8" width="5" height="8" rx="1.5"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M10 10V5a1.5 1.5 0 0 1 3 0v6"/><path d="M13 10V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M16 11.5a1.5 1.5 0 0 1 3 1V15c0 3.5-2.5 6-6 6h-1c-2 0-3.5-1-4.5-2.5L4.5 14a1.5 1.5 0 0 1 2.5-1.5L8 14"/></svg>',
  adult:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="3"/><path d="M3 21v-4a6 6 0 0 1 12 0v4"/><circle cx="18" cy="10" r="2.2"/><path d="M15 21v-3a3 3 0 0 1 6 0v3"/></svg>',
  child:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>',
  kite:'<svg viewBox="0 0 64 64"><path d="M32 4 52 26 32 50 12 26Z" fill="#E4572E"/><path d="M32 4 32 50M12 26h40" stroke="#F5C242" stroke-width="2.5"/><path d="M32 50c-2 5 4 7 1 12" stroke="#1B2A41" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M28 58l4-3 4 3M27 63l5-3 5 3" stroke="#4C7DD1" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  kiteHigh:'<svg viewBox="0 0 64 64"><circle cx="50" cy="14" r="8" fill="#F5C242"/><path d="M22 10 42 32 22 56 2 32Z" fill="#E4572E"/><path d="M22 10V56M2 32h40" stroke="#F5C242" stroke-width="2.5"/><path d="M22 56c-2 5 4 7 1 8" stroke="#1B2A41" stroke-width="2" fill="none"/></svg>',
  book:'<svg viewBox="0 0 64 64" fill="none" stroke="#1B2A41" stroke-width="3" stroke-linejoin="round"><path d="M8 12h20a4 4 0 0 1 4 4v36a4 4 0 0 0-4-4H8z" fill="#BFD9F2"/><path d="M56 12H36a4 4 0 0 0-4 4v36a4 4 0 0 1 4-4h20z" fill="#DCE8FA"/><path d="M14 22h10M14 30h10M40 22h10M40 30h10"/></svg>',
  monster:'<svg viewBox="0 0 64 64"><path d="M12 30a20 20 0 0 1 40 0v18a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z" fill="#3E9B5F"/><circle cx="24" cy="30" r="6" fill="#fff"/><circle cx="40" cy="30" r="6" fill="#fff"/><circle cx="25" cy="31" r="2.5" fill="#1B2A41"/><circle cx="41" cy="31" r="2.5" fill="#1B2A41"/><path d="M22 44q10 8 20 0" stroke="#1B2A41" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M20 12l-4-8M44 12l4-8" stroke="#3E9B5F" stroke-width="4" stroke-linecap="round"/></svg>',
  cards:'<svg viewBox="0 0 64 64" fill="none" stroke="#1B2A41" stroke-width="3" stroke-linejoin="round"><rect x="16" y="10" width="36" height="44" rx="5" fill="#DCE8FA" transform="rotate(8 34 32)"/><rect x="10" y="12" width="36" height="44" rx="5" fill="#fff"/><text x="28" y="42" font-family="Andika,sans-serif" font-size="20" text-anchor="middle" fill="#E4572E" stroke="none">zat</text></svg>',
  picture:'<svg viewBox="0 0 64 64" fill="none" stroke="#1B2A41" stroke-width="3" stroke-linejoin="round"><rect x="8" y="10" width="48" height="36" rx="5" fill="#FBE8D2"/><circle cx="22" cy="24" r="5" fill="#F5C242"/><path d="M12 42l14-12 8 8 8-6 12 10" fill="#3E9B5F"/><path d="M20 54h24"/></svg>'
};

// Nonsense words by pattern (no real words, no real-word homophones, English position rules respected)
const NWF = {

<script>
// ---------- State ----------
const KEY='kite-reader-v2';
const DEFAULT={v:2, level:0, settings:{period:'auto',stageOverride:null,voice:'',rate:0.8}, mastery:{}, stage:0, stageAt:null, sessions:[], timed:[], confus:{}, realMiss:{}, todayKey:'', today:{rounds:0,ms:0,done:false}};
let S=load();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); return Object.assign({},DEFAULT,o,{settings:Object.assign({},DEFAULT.settings,o.settings||{})}); } }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rollDay(){ const k=todayKey(); if(S.todayKey!==k){ S.todayKey=k; S.today={rounds:0,ms:0,done:false}; save(); } }
function sessionIdx(){ return S.sessions.length; }
function currentSession(){ rollDay(); let s=S.sessions[S.sessions.length-1]; if(!s||s.date!==S.todayKey){ s={date:S.todayKey,cards:0,helped:0,realN:0,realOk:0,picN:0,picOk:0,minutes:0,stage:lvlStage(),level:S.level||0}; S.sessions.push(s); } return s; }
function periodIdx(){ const p=S.settings.period; if(p==='B')return 0; if(p==='M')return 1; if(p==='E')return 2; const m=new Date().getMonth(); if(m>=7&&m<=10)return 0; if(m===11||m<=1)return 1; return 2; }
function stage(){ return S.settings.stageOverride!==null&&S.settings.stageOverride!==undefined ? S.settings.stageOverride : S.stage; }
function lvlStage(){ const lv=S.level||0; return lv===0?stage():lv===1?Math.max(2,stage()):3; }

// ---------- Utilities ----------
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];

  for(let r=0;r<15;r++){ let row; if(r<5) row=[take(Math.random()<0.2?'vc':'cvc'),take('cvc'),take('cvc'),take('cvc'),take('cvc')];
    else if(r<9) row=[take('cvc'),take('cvce'),take('cvc'),take('rcon'),take(Math.random()<0.5?'cvce':'rcon')];
    else if(r<12) row=[take('cvc'),take(Math.random()<0.5?'cvce':'rcon'),take('dig'),take('blend'),take(Math.random()<0.5?'dig':'blend')];
    else row=[take('blend'),take('ccc'),take(Math.random()<0.5?'dig':'rcon'),take('ccc'),take('blend')];
    rows.push(shuffle(row)); } return rows.flat(); }
function renderTimerPane(){
  const r=S.timed.slice(-1)[0]; const recent=r&&daysSince(r.date)<7;
  $('pane-timer').innerHTML=`<h2>Timed run: make-believe words</h2>
  <p>One minute on a fresh form laid out like the real Nonsense Word Fluency test, once a week at most. Script: "Here are some make-believe words. Point to each letter and tell me the sound, or read the whole word. Start here and go across the page. Ready? Begin."</p>
  <p>Tap <b>Start</b> as you say Begin. Tap a letter to mark a missed sound. Tap the small circle after a word if the child did not say the whole word. When the clock ends, tap the last word the child attempted. Silent e is grey and does not score.</p>
  <p class="note">${r?`Last run ${r.date}${recent?' (this week)':''}.`:'Not yet run.'}</p>
  <button class="pbtn ${recent?'warn':'primary'}" id="btn-open-timer">${recent?'Run anyway':'Open a form'}</button>`;
  $('btn-open-timer').addEventListener('click',openTimer);
}
function openTimer(){ T.items=genNWF(); T.ch=new Set(); T.wr=new Set(); T.last=null; T.running=false; T.started=false; T.left=60; T.recIdx=null; $('clock').textContent='1:00'; $('btn-timer-start').hidden=false; $('btn-timer-stop').hidden=true; $('timer-note').textContent='Tap Start as you say Begin.'; renderForm(); show('s-timer'); }
function renderForm(){
  let html='<div class="form">';
  for(let r=0;r<T.items.length;r+=5){ html+=`<div class="fr">${T.items.slice(r,r+5).map((w,j)=>{ const i=r+j; const us=parseWord(w); return `<span class="fi ${T.last===i?'last':''} ${T.last!==null&&i>T.last?'after':''}" data-i="${i}">${us.map((u,k)=>`<span class="ch ${u.silent?'silent':''} ${T.ch.has(i+'-'+k)?'miss':''}" data-i="${i}" data-k="${k}">${u.t}</span>`).join('')}<span class="wr ${T.wr.has(i)?'miss':''}" data-i="${i}" data-wr="1"></span></span>`; }).join('')}</div>`; }
  html+='</div><div id="timer-result"></div>';
  $('timer-body').innerHTML=html;
  $('timer-body').querySelectorAll('.fi,.ch,.wr').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); formTap(el); }));
}
function formTap(el){
  const i=+el.dataset.i;
  if(!T.started){ toast('Tap Start first.'); return; }
  if(!T.running){ T.last=i; renderForm(); scoreForm(); return; }
  if(el.dataset.wr){ T.wr.has(i)?T.wr.delete(i):T.wr.add(i); }
  else if(el.dataset.k!==undefined){ const u=parseWord(T.items[i])[+el.dataset.k]; if(u.silent) return; const key=i+'-'+el.dataset.k; T.ch.has(key)?T.ch.delete(key):T.ch.add(key); }
  renderForm();
}
function beep(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=660; g.gain.value=0.08; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.25); }catch(e){} }
$('btn-timer-start').addEventListener('click',()=>{ T.running=true; T.started=true; T.left=60; $('btn-timer-start').hidden=true; $('btn-timer-stop').hidden=false; $('timer-note').textContent='Tap any missed sound.'; T.tick=setInterval(()=>{ T.left--; $('clock').textContent='0:'+String(Math.max(0,T.left)).padStart(2,'0'); if(T.left<=0) stopTimer(); },1000); });
$('btn-timer-stop').addEventListener('click',stopTimer);
function stopTimer(){ clearInterval(T.tick); T.running=false; beep(); $('btn-timer-stop').hidden=true; $('timer-note').textContent='Time. Tap the last word the child attempted.'; }
$('btn-timer-back').addEventListener('click',()=>{ clearInterval(T.tick); T.running=false; openParent(); });
function scoreForm(){
  const pi=periodIdx(), L=T.last, upto=[...Array(L+1).keys()]; let cls=0,wrc=0;
  upto.forEach(i=>{ const units=parseWord(T.items[i]); let any=false; units.forEach((u,k)=>{ if(u.silent) return; if(T.ch.has(i+'-'+k)) any=true; else cls++; }); if(!any&&!T.wr.has(i)) wrc++; });
  const disc=(L>=4&&upto.slice(0,5).every(i=>parseWord(T.items[i]).every((u,k)=>u.silent||T.ch.has(i+'-'+k))))?'Discontinue rule would apply: no correct sounds in the first five words.':'';
  const prev=S.timed.filter((t,j)=>j!==T.recIdx).slice(-1)[0];
  const rec={date:todayKey(),cls,wrc,period:pi,attempted:L+1,stage:stage()};
  if(T.recIdx===null){ T.recIdx=S.timed.length; S.timed.push(rec); } else { S.timed[T.recIdx]=rec; } save();
  $('timer-result').innerHTML=`<div class="result"><h3 style="margin-top:0">Result, ${PERIOD_NAMES[pi].toLowerCase()}</h3>
  <div class="field"><span class="n">${cls}</span><span>${GOALS.cls.label}</span>${pill('cls',cls,pi)}${prev?`<span class="note">last time ${prev.cls}</span>`:''}</div>
  <div class="field"><span class="n">${wrc}</span><span>${GOALS.wrc.label}</span>${pill('wrc',wrc,pi)}${prev?`<span class="note">last time ${prev.wrc}</span>`:''}</div>
  <p class="note">Words attempted: ${L+1}. Green is the benchmark goal for core support, blue is negligible risk. ${disc}</p></div>`;
  $('timer-note').textContent='Scored. Tap the last word again if you change any marks.';
}
// ---------- Progress ----------
function renderProgress(){
  const pi=periodIdx(); const week=S.sessions.filter(s=>daysSince(s.date)<7); const mins=Math.round(week.reduce((a,s)=>a+(s.minutes||0),0));
  const learning=Object.keys(S.mastery).filter(k=>S.mastery[k].s===0&&S.mastery[k].seen>0);
  const conf=Object.entries(S.confus).sort((a,b)=>b[1]-a[1]).slice(0,12);
  let html=`<h2>Progress</h2><p>${mins} minute${mins===1?'':'s'} in the last seven days across ${week.length} day${week.length===1?'':'s'}. Current stage: ${stage()+1} of ${STAGES.length}, ${STAGES[stage()].name}.</p>`;
  html+=`<h3>Sessions</h3>`+(S.sessions.length?`<table><tr><th>Date</th><th>Flashcards</th><th>Helped</th><th>Real or not</th><th>Find the word</th><th>Stage</th></tr>${S.sessions.slice(-10).reverse().map(s=>`<tr><td>${s.date}</td><td>${s.cards}</td><td>${s.cards?Math.round(100*s.helped/s.cards)+'%':'-'}</td><td>${s.realN?Math.round(100*s.realOk/s.realN)+'% of '+s.realN:'-'}</td><td>${s.picN?Math.round(100*s.picOk/s.picN)+'% of '+s.picN:'-'}</td><td>${(s.stage||0)+1}</td></tr>`).join('')}</table>`:'<p class="note">No sessions yet.</p>');
  html+=`<h3>Timed runs</h3>`+(S.timed.length?`<table><tr><th>Date</th><th>Letter sounds</th><th>Words recoded</th><th>Attempted</th></tr>${S.timed.slice(-8).reverse().map(r=>`<tr><td>${r.date}</td><td>${pill('cls',r.cls,r.period)}</td><td>${pill('wrc',r.wrc,r.period)}</td><td>${r.attempted}</td></tr>`).join('')}</table>`:'<p class="note">No timed runs yet.</p>');
  html+=`<h3>Goals this period (${PERIOD_NAMES[pi].toLowerCase()})</h3><table><tr><th>Measure</th><th>Blue</th><th>Green</th><th>Yellow</th></tr>${Object.entries(GOALS).map(([k,g])=>`<tr><td>${g.label}</td><td>${g.blue[pi]}+</td><td>${g.green[pi]}+</td><td>${g.yellow[pi]}+</td></tr>`).join('')}</table>`;
  html+=`<h3>Still learning</h3><p>${learning.length?learning.join(', '):'<span class="note">Nothing waiting.</span>'}</p>`;
  html+=`<h3>Make-believe words judged real</h3><p>${conf.length?conf.map(([w,n])=>`${w} (${n})`).join(', '):'<span class="note">None yet.</span>'}</p>`;
  html+=`<p><button class="pbtn" id="btn-export">Copy all data</button> <span class="note">Copies progress as text to paste into a note or email.</span></p>`;
  $('pane-progress').innerHTML=html;
  $('btn-export').addEventListener('click',async()=>{ const txt=JSON.stringify(S,null,1); try{ await navigator.clipboard.writeText(txt); toast('Copied.'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied.'); }catch(err){ toast('Could not copy.'); } ta.remove(); } });
}
// ---------- Settings ----------
function renderSettings(){
  loadVoices(); const en=voices.filter(v=>/^en/i.test(v.lang));
  $('pane-settings').innerHTML=`<h2>Settings</h2>
  <div class="field"><label>Voice</label><select id="set-voice" style="font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%"><option value="">Automatic</option>${en.map(v=>`<option value="${v.name}" ${S.settings.voice===v.name?'selected':''}>${v.name} (${v.lang})</option>`).join('')}</select><button class="pbtn" id="set-test">Test: zat, fabe, ub</button></div>
  <div class="field"><label>Speed</label><input type="range" id="set-rate" min="0.6" max="1.1" step="0.05" value="${S.settings.rate}"><span class="note" id="set-rate-v">${S.settings.rate}</span></div>
  <div class="field"><label>Benchmark period</label>${[['auto','Automatic'],['B','Beginning'],['M','Middle'],['E','End']].map(([v,l])=>`<button class="pbtn ${S.settings.period===v?'on':''}" data-period="${v}">${l}</button>`).join('')}</div>
  <div class="field"><label>Pattern stage</label><button class="pbtn ${S.settings.stageOverride===null?'on':''}" data-stage="auto">Automatic (${S.stage+1})</button>${STAGES.map((st,i)=>`<button class="pbtn ${S.settings.stageOverride===i?'on':''}" data-stage="${i}">${i+1}. ${st.name}</button>`).join('')}</div>
  <div class="field"><button class="pbtn" id="set-more">Allow one more round today</button><span class="note">${S.today.done?'Today is marked finished.':'Today is not finished.'}</span></div>
  <h3>On the iPad</h3><p>Open this page in Safari, tap Share, then "Add to Home Screen." It opens full screen and keeps its data on the device. Deleting the icon deletes the data, so copy the data from Progress now and then.</p>
  <h3>Data</h3><div class="field"><button class="pbtn warn" id="set-reset">Hold to erase everything</button></div>
  <p class="note">Practice words are original. The official DIBELS 8th Edition forms are copyright University of Oregon and are not included. Benchmark goals are the published first-grade cut points dated July 2020.</p>`;
  $('set-voice').addEventListener('change',e=>{ S.settings.voice=e.target.value; save(); });
  $('set-test').addEventListener('click',async()=>{ await speak(sayNonsense('zat')); await wait(300); await speak(sayNonsense('fabe')); await wait(300); await speak(sayNonsense('ub')); });
  $('set-rate').addEventListener('input',e=>{ S.settings.rate=+e.target.value; $('set-rate-v').textContent=S.settings.rate; save(); });
  $('pane-settings').querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{ S.settings.period=b.dataset.period; save(); openParent(); }));
  $('pane-settings').querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{ S.settings.stageOverride=b.dataset.stage==='auto'?null:+b.dataset.stage; save(); openParent(); }));
  $('set-more').addEventListener('click',()=>{ rollDay(); S.today.done=false; S.today.rounds=Math.min(S.today.rounds,5); S.today.ms=Math.min(S.today.ms,20*60*1000); save(); toast('One more round allowed.'); renderSettings(); });
  pointerHold($('set-reset'),3000,()=>{ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEFAULT)); save(); toast('Erased.'); openParent(); });
}
// ---------- Start ----------
rollDay(); renderHome(); show('s-home');
